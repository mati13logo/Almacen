<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Códigos de Almacén</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #dde1e7;
    --accent: #1a5c8a;
    --accent-light: #e8f1f8;
    --accent-hover: #154e78;
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --text: #1a1e26;
    --text-muted: #6b7280;
    --green: #1a7a4a;
    --green-light: #e8f5ee;
    --mono: 'Courier New', monospace;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--accent);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  header span {
    font-size: 0.75rem;
    opacity: 0.7;
    margin-left: auto;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  /* CARGA CSV */
  #load-section {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  #load-section.hidden { display: none; }

  #load-section p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  #load-section strong { color: var(--text); }

  .btn-file {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-file:hover { background: var(--accent-hover); }
  #file-input { display: none; }

  .btn-demo {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    margin-left: 10px;
    transition: all 0.15s;
  }
  .btn-demo:hover { border-color: var(--accent); color: var(--accent); }

  /* APP PRINCIPAL */
  #app-section { display: none; }
  #app-section.visible { display: block; }

  /* BARRA DE BÚSQUEDA */
  .search-bar {
    background: var(--surface);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-bar input {
    flex: 1;
    min-width: 180px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-bar input:focus { border-color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .toolbar-left {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .count-badge {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .btn-add {
    background: var(--green);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add:hover { background: #155f3a; }

  .btn-export {
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-export:hover { border-color: var(--accent); color: var(--accent); }

  /* TABLA */
  .table-wrap {
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  thead {
    background: #f7f8fa;
    border-bottom: 2px solid var(--border);
  }

  th {
    padding: 11px 14px;
    text-align: left;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  td {
    padding: 11px 14px;
    border-bottom: 1px solid #f0f2f5;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }

  .code-cell {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }

  .desc-cell {
    color: var(--text);
    line-height: 1.4;
  }

  .actions-cell {
    white-space: nowrap;
    text-align: right;
  }

  .btn-edit {
    background: var(--accent-light);
    color: var(--accent);
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-edit:hover { background: #d0e4f5; }

  .btn-delete {
    background: var(--danger-light);
    color: var(--danger);
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    margin-left: 6px;
    transition: background 0.15s;
  }
  .btn-delete:hover { background: #f9ddd9; }

  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }

  .modal h2 {
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: var(--text);
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .field input, .field textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }

  .field input.code-input { font-family: var(--mono); font-size: 1rem; }

  .field textarea { resize: vertical; min-height: 80px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: var(--text-muted); }

  .btn-save {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-save:hover { background: var(--accent-hover); }

  .error-msg {
    background: var(--danger-light);
    color: var(--danger);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    margin-top: 8px;
    display: none;
  }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1e26;
    color: white;
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 0.88rem;
    z-index: 300;
    transition: transform 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Responsive mobile */
  @media (max-width: 520px) {
    th:nth-child(3), td:nth-child(3) { display: none; }
    .toolbar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

<header>

    <path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
    <path stroke-linecap="round" stroke-linejoin="round" d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/>

      <button class="btn-primary" onclick="doSearch()">Buscar</button>

<script>
  let data = [];
  let filtered = [];
  let editingIndex = -1;
  const PHOTOS_PATH = 'G:/MTTL/CodigosDeAlmacen/';
  const NOTION_TOKEN = 'ntn_k74277311783zbfeZduFzL9PjyOeabWl1SWLcnnbhP20eu';
  const NOTION_DB = '3f21baba2eea802ba0d9d12f0d63b3fd';
  const R2_BASE = 'https://pub-6bbb41d0755845f5bd62284dcf8218e7.r2.dev';
  const photoCache = {};

  // ── AUTO-CARGA DESDE NOTION AL INICIAR ────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('load-section').innerHTML = `
      <p style="color:var(--text-muted); font-size:0.9rem;">⏳ Cargando datos desde Notion...</p>`;
    try {
      data = await loadFromNotion();
      filtered = [...data];
      showApp();
    } catch (e) {
      document.getElementById('load-section').innerHTML = `
        <p style="color:var(--danger); font-size:0.9rem; margin-bottom:16px;">⚠️ No se pudo cargar desde Notion. Cargá el CSV manualmente.</p>
        <label class="btn-file" for="file-input">📂 Cargar CSV</label>
        <input type="file" id="file-input" accept=".csv,.txt" onchange="handleFileInput(event)">`;
    }
  });

  async function loadFromNotion() {
    let results = [];
    let cursor = undefined;
    let pageCount = 0;
    const MAX_PAGES = 200; // 200 páginas x 100 registros = 20.000 registros máximo

    do {
      const body = { page_size: 100 };
      if (cursor) body.start_cursor = cursor;

      let res, json;
      for (let intento = 0; intento < 3; intento++) {
        res = await fetch(`https://api.notion.com/v1/databases/${NOTION_DB}/query`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + NOTION_TOKEN,
            'Notion-Version': '2022-06-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        if (res.ok) break;
        await new Promise(r => setTimeout(r, 1000 * (intento + 1))); // esperar antes de reintentar
      }
      if (!res.ok) throw new Error('Error Notion ' + res.status);
      json = await res.json();
      if (!json.results) throw new Error('Respuesta inválida de Notion');

      for (const page of json.results) {
        const props = page.properties;
        // CODIGO es el campo numérico específico, no TTL ni IDarticulo
        const codeVal = getNotionProp(props, ['CODIGO']);
        // Descripción viene de DESCRIPCION1 y/o DESCRIPCION2
        const desc1 = getNotionProp(props, ['DESCRIPCION1']);
        const desc2 = getNotionProp(props, ['DESCRIPCION2']);
        const descVal = [desc1, desc2].filter(d => d && d.trim()).join(' — ');
        if (codeVal) results.push({ code: String(codeVal).trim(), desc: descVal || '' });
      }

      // Actualizar contador mientras carga
      document.getElementById('load-section').innerHTML = `
        <p style="color:var(--text-muted); font-size:0.9rem;">⏳ Cargando datos... ${results.length} repuestos</p>`;

      cursor = (json.has_more && json.next_cursor) ? json.next_cursor : null;
      pageCount++;

      if (pageCount >= MAX_PAGES) break; // cortar si algo sale mal

    } while (cursor);

    // Sin filtro de duplicados por ahora
    return results.sort((a, b) => {
      const na = parseInt(a.code, 10), nb = parseInt(b.code, 10);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return a.code.localeCompare(b.code);
    });
  }

  function getNotionProp(props, names) {
    for (const name of names) {
      if (!props[name]) continue;
      const p = props[name];
      if (p.type === 'title') return p.title.map(t => t.plain_text).join('').trim();
      if (p.type === 'rich_text') return p.rich_text.map(t => t.plain_text).join('').trim();
      if (p.type === 'number') return p.number !== null ? String(p.number) : '';
      if (p.type === 'select') return p.select ? p.select.name : '';
    }
    return '';
  }

  // ── CSV PARSE ──────────────────────────────────────────────
  // Parsea una línea CSV respetando comillas (campos con comas/punto y coma dentro de "...")
  function parseCSVLine(line, sep) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === sep && !inQuotes) {
        result.push(cur);
        cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result.map(s => s.trim());
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length === 0) return [];

    // Detectar separador a partir de la primera línea
    const sample = lines[0];
    const sep = sample.includes(';') ? ';' : sample.includes('\t') ? '\t' : ',';

    // Detectar si tiene encabezado
    const firstLower = sample.toLowerCase();
    const hasHeader = firstLower.includes('codigo') || firstLower.includes('descripcion') || firstLower.includes('código');
    const start = hasHeader ? 1 : 0;

    return lines.slice(start).map(line => {
      const cols = parseCSVLine(line, sep).map(c => c.replace(/^"|"$/g, '').trim());

      // Estructura esperada: [ID corto opcional], CODIGO, DESCRIPCION1, DESCRIPCION2...
      // El código real tiene 6-8 dígitos. Evitamos IDs cortos (1-5 dígitos) que aparecen antes.
      let codeIdx = cols.findIndex(c => /^\d{6,8}$/.test(c));
      if (codeIdx === -1) codeIdx = cols.findIndex(c => /^\d{4,}$/.test(c));
      if (codeIdx === -1) codeIdx = 0;

      const code = cols[codeIdx] || '';
      let descParts = cols.slice(codeIdx + 1).filter(c => c && c.length > 0);

      // Filtramos campos que son solo metadata interna (no texto descriptivo útil):
      // - números sueltos o decimales (stock, cantidades): "2", "1", "0", "17,92000008"
      // - códigos cortos en mayúsculas sin espacios (categoría/proveedor): "ALPMA", "ANEKO", "A"
      // - fechas sueltas
      descParts = descParts.filter(p => {
        if (/^-?\d+([.,]\d+)?$/.test(p)) return false;          // número o decimal puro
        if (/^[A-ZÑ]{1,8}$/.test(p)) return false;               // sigla corta en mayúsculas
        if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(p)) return false; // fecha
        return true;
      });

      const desc = descParts.join(' — ');

      return { code, desc };
    }).filter(r => r.code).sort((a, b) => {
      const na = parseInt(a.code, 10), nb = parseInt(b.code, 10);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return a.code.localeCompare(b.code);
    });
  }

  // ── CARGA ARCHIVO MANUAL (fallback) ───────────────────────
  function handleFileInput(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      data = parseCSV(ev.target.result);
      filtered = [...data];
      showApp();
    };
    reader.readAsText(file, 'UTF-8');
  }

  // Mantener compatibilidad con el input original si existe
  const fileInput = document.getElementById('file-input');
  if (fileInput) fileInput.addEventListener('change', handleFileInput);

  function showApp() {
    document.getElementById('load-section').classList.add('hidden');
    document.getElementById('app-section').classList.add('visible');
    renderTable(filtered);
  }

  // ── LOGIN ──────────────────────────────────────────────────
  const LOGIN_PASS = '1234';
  let isLoggedIn = false;

  function toggleLogin() {
    if (isLoggedIn) {
      isLoggedIn = false;
      document.getElementById('login-label').textContent = 'Ingresar';
      document.getElementById('login-btn').style.background = 'rgba(255,255,255,0.15)';
      document.getElementById('btn-agregar').style.display = 'none';
      renderTable(filtered);
      showToast('Sesión cerrada');
    } else {
      const pass = prompt('Contraseña:');
      if (pass === LOGIN_PASS) {
        isLoggedIn = true;
        document.getElementById('login-label').textContent = 'Salir';
        document.getElementById('login-btn').style.background = 'rgba(255,255,255,0.3)';
        document.getElementById('btn-agregar').style.display = 'inline-flex';
        renderTable(filtered);
        showToast('Sesión iniciada');
      } else if (pass !== null) {
        showToast('Contraseña incorrecta');
      }
    }
  }

  // ── BÚSQUEDA ───────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });

  function doSearch() {
    const q1 = document.getElementById('search-input-1').value.trim().toLowerCase();
    const q2 = document.getElementById('search-input-2').value.trim().toLowerCase();
    if (!q1 && !q2) {
      filtered = [...data];
    } else {
      filtered = data.filter(r => {
        const hay = (r.code + ' ' + r.desc).toLowerCase();
        const m1 = !q1 || hay.includes(q1);
        const m2 = !q2 || hay.includes(q2);
        return m1 && m2;
      });
    }
    renderTable(filtered);
  }

  function resetSearch() {
    document.getElementById('search-input-1').value = '';
    document.getElementById('search-input-2').value = '';
    filtered = [...data];
    renderTable(filtered);
  }

  // ── RENDER TABLA ───────────────────────────────────────────
  function renderTable(rows) {
    const tbody = document.getElementById('table-body');
    const countEl = document.getElementById('result-count');
    const headerCount = document.getElementById('header-count');

    countEl.textContent = rows.length === 1 ? '1 resultado' : `${rows.length} resultados`;
    headerCount.textContent = `${data.length} repuestos`;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state">No se encontraron repuestos</div></td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((r, i) => {
      const realIdx = data.indexOf(r);
      const actions = isLoggedIn ? `
        <button class="btn-edit" onclick="event.stopPropagation(); openEdit(${realIdx})">Editar</button>
        <button class="btn-delete" onclick="event.stopPropagation(); deleteItem(${realIdx})">Eliminar</button>` : '';
      return `<tr onclick="openDetail(${realIdx})" style="cursor:pointer">
        <td class="code-cell">${esc(r.code)}</td>
        <td class="desc-cell">${esc(r.desc)}</td>
        <td class="actions-cell">${actions}</td>
      </tr>`;
    }).join('');
  }

  // ── JSONP helper (evita CORS con Apps Script) ─────────────
  function jsonp(url, onSuccess, onError) {
    const cbName = 'jsonp_cb_' + Date.now();
    const script = document.createElement('script');
    let done = false;
    window[cbName] = function(data) {
      done = true;
      delete window[cbName];
      document.body.removeChild(script);
      onSuccess(data);
    };
    script.onerror = function() {
      if (!done) { delete window[cbName]; document.body.removeChild(script); onError(); }
    };
    setTimeout(function() {
      if (!done) { delete window[cbName]; if (script.parentNode) document.body.removeChild(script); onError(); }
    }, 15000);
    script.src = url + '&callback=' + cbName;
    document.body.appendChild(script);
  }

  // ── DETALLE (click en fila) ────────────────────────────────
  function openDetail(idx) {
    const r = data[idx];
    document.getElementById('detail-code').textContent = r.code;
    document.getElementById('detail-desc').textContent = r.desc || '(sin descripción)';

    // Reset foto
    const container = document.getElementById('detail-photo-container');
    container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.85rem;">Buscando foto...</div>`;

    document.getElementById('detail-overlay').classList.add('open');
    loadPhoto(r.code, container);
  }

  async function loadPhoto(code, container) {
    if (photoCache[code] !== undefined) {
      renderPhotoUrl(photoCache[code], container, code);
      return;
    }
    // Probar extensiones en R2
    const extensions = ['.jpg', '.jpeg', '.JPG', '.JPEG', '.png'];
    let found = null;
    for (const ext of extensions) {
      const url = `${R2_BASE}/${code}${ext}`;
      try {
        const res = await fetch(url, { method: 'HEAD' });
        if (res.ok) { found = url; break; }
      } catch(e) {}
    }
    photoCache[code] = found;
    renderPhotoUrl(found, container, code);
  }

  function renderPhotoUrl(url, container, code) {
    if (!url) {
      container.innerHTML = `
        <svg width="100%" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg" style="border-radius:8px; border:1.5px solid var(--border);">
          <rect width="300" height="160" fill="#f0f2f5"/>
          <rect x="110" y="45" width="80" height="60" rx="6" fill="#dde1e7"/>
          <circle cx="150" cy="62" r="10" fill="#c4cad4"/>
          <polygon points="110,105 140,70 165,90 185,65 220,105" fill="#c4cad4"/>
          <text x="150" y="138" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Sin foto disponible</text>
        </svg>`;
      return;
    }
    container.innerHTML = `
      <a href="${url}" target="_blank" style="display:block;">
        <img src="${url}" alt="Foto ${code}"
          style="width:100%; border-radius:8px; border:1.5px solid var(--border); display:block; max-height:280px; object-fit:contain; background:#f0f2f5;"
          onerror="this.parentElement.innerHTML='<p style=\\'color:var(--text-muted);font-size:0.85rem;text-align:center;\\'>Sin foto disponible</p>'">
      </a>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-top:6px; text-align:center;">Tocá la foto para verla en tamaño completo</p>`;
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
  }

  function handleDetailOverlayClick(e) {
    if (e.target === document.getElementById('detail-overlay')) closeDetail();
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── AGREGAR ────────────────────────────────────────────────
  function openAdd() {
    editingIndex = -1;
    document.getElementById('modal-title').textContent = 'Agregar repuesto';
    document.getElementById('modal-code').value = '';
    document.getElementById('modal-desc').value = '';
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('modal-code').focus(), 50);
  }

  // ── EDITAR ─────────────────────────────────────────────────
  function openEdit(idx) {
    editingIndex = idx;
    document.getElementById('modal-title').textContent = 'Editar repuesto';
    document.getElementById('modal-code').value = data[idx].code;
    document.getElementById('modal-desc').value = data[idx].desc;
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('modal-desc').focus(), 50);
  }

  // ── GUARDAR ────────────────────────────────────────────────
  function saveItem() {
    const code = document.getElementById('modal-code').value.trim();
    const desc = document.getElementById('modal-desc').value.trim();
    const errEl = document.getElementById('modal-error');

    if (!code || !desc) {
      errEl.textContent = 'Completá el código y la descripción.';
      errEl.style.display = 'block';
      return;
    }

    // Verificar código duplicado (excepto al editar el mismo)
    const duplicate = data.findIndex((r, i) => r.code === code && i !== editingIndex);
    if (duplicate !== -1) {
      errEl.textContent = `El código ${code} ya existe.`;
      errEl.style.display = 'block';
      return;
    }

    if (editingIndex === -1) {
      data.push({ code, desc });
      showToast('Repuesto agregado');
    } else {
      data[editingIndex] = { code, desc };
      showToast('Cambios guardados');
    }

    doSearch();
    closeModal();
  }

  // ── ELIMINAR ───────────────────────────────────────────────
  function deleteItem(idx) {
    const r = data[idx];
    if (!confirm(`¿Eliminar "${r.code} – ${r.desc}"?`)) return;
    data.splice(idx, 1);
    doSearch();
    showToast('Repuesto eliminado');
  }

  // ── MODAL ──────────────────────────────────────────────────
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  // ── EXPORTAR CSV ───────────────────────────────────────────
  function exportCSV() {
    const rows = ['Codigo,Descripcion', ...data.map(r => `"${r.code}","${r.desc.replace(/"/g,'""')}"`  )];
    const blob = new Blob([rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CodigosAlmacen.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV exportado');
  }

  // ── TOAST ──────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
